[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "trading-lab"
version = "0.1.0"
description = "CLI-first cryptocurrency backtesting research toolkit"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "ccxt>=4.4,<5",
    "numpy>=2.1,<3",
    "openpyxl>=3.1.5,<4",
    "pandas>=3.0,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "PyYAML>=6.0.2,<7",
    "SQLAlchemy>=2.0.36,<3",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
trading-lab = "trading_lab.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib -m 'not integration and not network'"
markers = [
    "integration: requires a separately configured PostgreSQL database",
    "network: explicitly accesses an external exchange API",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
